name: Vless Proxy Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Xray Server & Generate Link
        run: |
          # Generate a real Vless link using GitHub runner IP/Details
          UUID="d342d11e-d424-4583-b36e-524abb1f0afa"
          RUNNER_IP=$(curl -s ifconfig.me)
          
          echo "=================================================="
          echo "VLESS PROXY CONFIGURATION LINK:"
          echo "vless://${UUID}@${RUNNER_IP}:443?encryption=none&security=none&type=tcp#GitHub-Vless-Proxy"
          echo "=================================================="
